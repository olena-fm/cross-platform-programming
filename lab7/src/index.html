<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Notes Tauri</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Smart Notes Tauri</h1>
      <p>Десктопна версія застосунку для нотаток на Tauri</p>
    </header>

    <main class="container">
      <section class="card">
        <h2>Додати нотатку</h2>
        <input type="text" id="noteInput" class="note-input" placeholder="Введіть текст нотатки" />
        <button id="addNoteButton" class="button">Додати нотатку</button>
        <p id="message" class="message"></p>
      </section>

      <section class="card">
        <h2>Список нотаток</h2>
        <ul id="notesList" class="notes-list"></ul>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
